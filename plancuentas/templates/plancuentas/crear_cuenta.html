{% extends 'base.html' %}
{% block title %}Crear Cuenta{% endblock %}
{% block content %}
<h1 class="mb-4">Crear cuenta</h1>
<form method="post">{% csrf_token %}
  {{ form.as_p }}
  <button class="btn" type="submit">Guardar</button>

</form>
{% endblock %}
