{% extends 'base.html' %}
{% block title %}Aprobar Comprobante{% endblock %}
{% block content %}
<h1 class="mb-4">Aprobar comprobante {{ comprobante.numero }}</h1>
<form method="post">{% csrf_token %}
  {{ form.as_p }}
  <button class="btn" type="submit">Confirmar aprobación</button>
  <a class="btn btn-secondary" href="{% url 'comprobantes:detalle_comprobante' comprobante.pk %}">Cancelar</a>
</form>
{% endblock %}
