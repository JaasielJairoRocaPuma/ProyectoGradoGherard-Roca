{% extends 'base.html' %}
{% block title %}Exportar Balance{% endblock %}
{% block content %}
<h1 class="mb-4">Exportar balance {{ balance.nombre }}</h1>
<form method="post">{% csrf_token %}
  {{ form.as_p }}
  <button class="btn" type="submit">Exportar</button>
  <a class="btn btn-secondary" href="{% url 'balancesumasysaldos:detalle_balance' balance.pk %}">Cancelar</a>
</form>
{% endblock %}
